<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>当妹卡降临到我身边 — AI 文字冒险 × 卡牌对战</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&family=LXGW+WenKai:wght@300;400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/splash.css">
  <link rel="stylesheet" href="css/title.css">
  <link rel="stylesheet" href="css/event.css">
  <link rel="stylesheet" href="css/notifications.css">
  <link rel="stylesheet" href="css/ai.css">
  <link rel="stylesheet" href="css/deck.css">
  <link rel="stylesheet" href="css/companions.css">
  <link rel="stylesheet" href="css/inventory.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
  <!-- ==================================================================
   开场动画（光之涟漪）— 始终首先显示，纯 CSS 动画
   ================================================================== -->
  <div id="splash-overlay">
    <div class="splash-dot"></div>
    <div class="splash-ripple"></div>
    <div class="splash-ripple"></div>
    <div class="splash-ripple"></div>
    <div class="splash-title">当妹卡降临到我身边</div>
    <div class="splash-subtitle">AI 文字冒险 × 卡牌对战</div>
  </div>

  <!-- 封面轮播背景 -->
  <div id="cover-slideshow">
    <div class="cover-slide" style="background-image:url('assets/covers/封面一.png')"></div>
    <div class="cover-slide" style="background-image:url('assets/covers/封面二.png')"></div>
    <div class="cover-slide" style="background-image:url('assets/covers/封面三.png')"></div>
    <div class="cover-slide" style="background-image:url('assets/covers/封面四.png')"></div>
    <div class="cover-overlay"></div>
  </div>
  <!-- 标题界面 -->
  <div id="title-screen"></div>
  <!-- 侧边栏 -->
  <nav id="sidebar"></nav>
  <!-- 主内容区 -->
  <main id="main-content"></main>
  <!-- 设置面板模态框 -->
  <div id="settings-modal" class="hidden"></div>
  <!-- 通知层 -->
  <div id="notification-container"></div>
  <!-- 粒子 Canvas -->
  <canvas id="particles-canvas"></canvas>
  <!-- 自定义右键菜单 -->
  <div id="context-menu"></div>

  <!-- Splash 独立控制（非 module，确保第一时间执行） -->
  <script>
    (function () {
      var overlay = document.getElementById('splash-overlay');
      if (!overlay) return;

      // 动画总时长 ~2s，之后淡出
      var SPLASH_DURATION = 2000;

      // 开始淡出
      function finish() {
        overlay.classList.add('outro');
        // 过渡结束后移除 DOM
        setTimeout(function () {
          if (overlay.parentNode) {
            overlay.parentNode.removeChild(overlay);
          }
          // 通知 app.js 模块 splash 已完成
          window.__splashDone = true;
          window.dispatchEvent(new Event('splashdone'));
        }, 400);
      }

      // 倒计时结束
      setTimeout(finish, SPLASH_DURATION);

      // 点击可跳过
      overlay.addEventListener('click', function () {
        finish();
      });
    })();
  </script>

  <!-- JS 模块 -->
  <script type="module" src="js/app.js"></script>
</body>
</html>

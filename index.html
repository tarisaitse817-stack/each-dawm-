<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>当妹卡降临到我身边</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&family=LXGW+WenKai:wght@300;400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/base.css?v=29">
  <link rel="stylesheet" href="css/sidebar.css?v=29">
  <link rel="stylesheet" href="css/splash.css?v=29">
  <link rel="stylesheet" href="css/title.css?v=29">
  <link rel="stylesheet" href="css/event.css?v=29">
  <link rel="stylesheet" href="css/notifications.css?v=29">
  <link rel="stylesheet" href="css/ai.css?v=29">
  <link rel="stylesheet" href="css/companions.css?v=29">
  <link rel="stylesheet" href="css/inventory.css?v=29">
  <link rel="stylesheet" href="css/scene.css?v=29">
  <link rel="stylesheet" href="css/closeup.css?v=29">
  <link rel="stylesheet" href="css/transition.css?v=29">
  <link rel="stylesheet" href="css/settings.css?v=29">
  <link rel="stylesheet" href="css/sillytavern.css?v=29">
  <link rel="stylesheet" href="css/map.css?v=29">
</head>
<body>
  <!-- ==================================================================
   开场动画（光之涟漪）— 始终首先显示，纯 CSS 动画
   ================================================================== -->
  <div id="splash-overlay">
    <div class="splash-dot"></div>
    <div class="splash-ripple"></div>
    <div class="splash-ripple"></div>
    <div class="splash-ripple"></div>
    <div class="splash-title" id="splash-title-text">当妹卡降临到我身边</div>
  </div>

  <!-- 时间显示 -->
  <div id="time-display" class="hidden"></div>

  <!-- 地点背景图层 -->
  <div id="location-bg"></div>
  <!-- 封面背景（用户要求：固定为第一条「封面0」，其余 3 张保留在 assets/covers/ 不参与显示） -->
  <div id="cover-slideshow">
    <div class="cover-slide" style="background-image:url('assets/covers/封面0.png')"></div>
    <div class="cover-overlay"></div>
  </div>
  <!-- 标题界面 -->
  <div id="title-screen"></div>
  <!-- 侧边栏 -->
  <nav id="sidebar" class="sidebar-hidden"></nav>
  <!-- 主内容区 -->
  <main id="main-content" class="full-width"></main>
  <!-- 设置面板模态框 -->
  <div id="settings-modal" class="hidden"></div>
  <!-- 通知层 -->
  <div id="notification-container"></div>
  <!-- 粒子 Canvas -->
  <canvas id="particles-canvas"></canvas>

  <!-- Splash 独立控制（非 module，确保第一时间执行） -->
  <script>
    (function () {
      var overlay = document.getElementById('splash-overlay');
      if (!overlay) return;

      // 标题字符拆分为彩色独立字符
      var splashTitle = document.getElementById('splash-title-text');
      if (splashTitle) {
        var colors = ['#D4A574','#C0392B','#F5ECD7','#B0BEC5','#D4A574','#C0392B','#F5ECD7','#B0BEC5','#D4A574'];
        var text = splashTitle.textContent.trim();
        splashTitle.textContent = '';
        for (var i = 0; i < text.length; i++) {
          var span = document.createElement('span');
          span.className = 'char';
          span.textContent = text[i];
          span.style.color = colors[i % colors.length];
          span.style.animationDelay = (0.05 * i).toFixed(2) + 's';
          splashTitle.appendChild(span);
        }
      }

      // 动画总时长 ~2s，之后淡出
      var SPLASH_DURATION = 2000;

      // 开始淡出
      function finish() {
        overlay.classList.add('outro');
        // 过渡结束后移除 DOM
        setTimeout(function () {
          if (overlay.parentNode) {
            overlay.parentNode.removeChild(overlay);
          }
          // 通知 app.js 模块 splash 已完成
          window.__splashDone = true;
          window.dispatchEvent(new Event('splashdone'));
        }, 400);
      }

      // 倒计时结束
      setTimeout(finish, SPLASH_DURATION);

      // 点击可跳过
      overlay.addEventListener('click', function () {
        finish();
      });
    })();
  </script>

  <!-- SillyTavern 集成：Dexie (IndexedDB 封装) 先行加载，暴露全局 window.Dexie -->
  <script src="lib/dexie.min.js"></script>
  <!-- JS 模块 -->
  <script type="module" src="js/app.js?v=29"></script>
</body>
</html>
